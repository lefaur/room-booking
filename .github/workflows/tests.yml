name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # публикация Allure-отчёта в ветку gh-pages

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Поднять сервисы
        run: docker compose up -d --build --wait

      - name: "Автотесты: API и UI (параллельный проход + @serial последовательно)"
        run: docker compose run --rm -e PARALLEL=4 -e GITHUB_SHA tests

      - name: Логи сервисов
        if: always()
        run: docker compose logs --no-color > services.log

      - name: Сохранить отчёты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            reports/
            services.log

      - name: Забрать историю Allure
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # тот же образ, что и для локального отчёта (tools/allure); history с прошлой публикации даёт график трендов
      - name: Собрать Allure-отчёт
        if: always() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p reports/allure-results/history
          cp -r gh-pages/history/. reports/allure-results/history/ 2>/dev/null || true
          docker compose run --rm allure allure generate allure-results -o allure-report --clean

      - name: Опубликовать на GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: reports/allure-report
