server {
    listen 80;

    # DNS докера. С переменной в proxy_pass nginx резолвит имя сервиса на каждый запрос,
    # а не один раз при старте: пересобранный контейнер с новым IP подхватывается без рестарта gateway
    resolver 127.0.0.11 valid=5s ipv6=off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # межсервисные эндпоинты наружу не публикуются
    location ~ ^/api/[^/]+/internal(/|$) {
        default_type application/json;
        return 404 '{"detail":"Not Found"}';
    }

    # /api/<префикс>/<путь> → http://<сервис>:8000/<путь>
    location ~ ^/api/(auth|booking|tg|scheduler)/(.*)$ {
        set $service $1;
        set $path $2;
        if ($service = tg) {
            set $service tgbot;
        }
        proxy_pass http://$service:8000/$path$is_args$args;
    }

    location = /api/ {
        default_type text/plain;
        return 200 "OfficeSpace API gateway\nauth:      /api/auth/docs\nbooking:   /api/booking/docs\ntgbot:     /api/tg/docs\nscheduler: /api/scheduler/docs\n";
    }

    # всё остальное — веб-интерфейс (SPA)
    location / {
        set $web web;
        proxy_pass http://$web:80;
    }
}
